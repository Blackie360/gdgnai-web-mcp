<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="WebMCP flow: site registers tools, agent invokes with JSON">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#47bfff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="320" rx="16" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#ede6ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">WebMCP: tools instead of DOM scraping</text>

  <rect x="40" y="70" width="240" height="200" rx="12" fill="#14141a" stroke="#863bff" stroke-width="2"/>
  <text x="160" y="98" text-anchor="middle" fill="#863bff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Your website</text>
  <text x="160" y="130" text-anchor="middle" fill="#c8c0e0" font-family="monospace" font-size="11">registerTool()</text>
  <text x="160" y="152" text-anchor="middle" fill="#c8c0e0" font-family="monospace" font-size="11">toolname=</text>
  <text x="160" y="174" text-anchor="middle" fill="#c8c0e0" font-family="monospace" font-size="11">toolparamdescription=</text>
  <text x="160" y="210" text-anchor="middle" fill="#9a92b8" font-family="system-ui,sans-serif" font-size="11">Declarative or imperative</text>

  <path d="M290 170 H350" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#47bfff"/>
    </marker>
  </defs>

  <rect x="360" y="70" width="240" height="200" rx="12" fill="#14141a" stroke="#47bfff" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" fill="#47bfff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">modelContext</text>
  <text x="480" y="130" text-anchor="middle" fill="#c8c0e0" font-family="system-ui,sans-serif" font-size="11">Structured tool catalog</text>
  <text x="480" y="152" text-anchor="middle" fill="#c8c0e0" font-family="system-ui,sans-serif" font-size="11">JSON input schemas</text>
  <text x="480" y="174" text-anchor="middle" fill="#c8c0e0" font-family="system-ui,sans-serif" font-size="11">Read-only hints</text>
  <text x="480" y="210" text-anchor="middle" fill="#9a92b8" font-family="system-ui,sans-serif" font-size="11">Agent-readable contract</text>

  <path d="M610 170 H670" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="680" y="70" width="240" height="200" rx="12" fill="#14141a" stroke="#ede6ff" stroke-width="2"/>
  <text x="800" y="98" text-anchor="middle" fill="#ede6ff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">AI agent</text>
  <text x="800" y="130" text-anchor="middle" fill="#c8c0e0" font-family="monospace" font-size="11">{ tool, arguments }</text>
  <text x="800" y="152" text-anchor="middle" fill="#c8c0e0" font-family="system-ui,sans-serif" font-size="11">No HTML parsing</text>
  <text x="800" y="174" text-anchor="middle" fill="#c8c0e0" font-family="system-ui,sans-serif" font-size="11">User stays in control</text>
  <text x="800" y="210" text-anchor="middle" fill="#9a92b8" font-family="system-ui,sans-serif" font-size="11">Structured responses</text>

  <text x="480" y="300" text-anchor="middle" fill="#6b6388" font-family="system-ui,sans-serif" font-size="12">GDG Nairobi · Google I/O Extended Nairobi 2026</text>
</svg>
